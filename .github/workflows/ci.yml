name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend and Rust checks (Windows x64)
    # The Rust suite exercises Win32-specific behavior, so CI must match the
    # release runner family instead of a cheaper Linux job.
    runs-on: windows-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: pwsh

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json

      - name: Set up Rust stable
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo dependencies and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck

      - name: Run frontend test suite
        run: npm --prefix frontend test

      - name: Run Rust test suite
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
