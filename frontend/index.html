<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content-Security-Policy retained from the retired Legacy_Frontend so
         the React_Frontend is no less restrictive
         (Requirement 28.2). Allows the Google Fonts stylesheets/font files used
         below plus the Roblox/BloxGen endpoints and the Tauri IPC origin.
         cdn.weao.gg is allowed in img-src only — the WEAO page renders executor
         logos from it — and deliberately NOT in connect-src, so the relaxation
         cannot become a fetch/exfiltration path. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.rbxcdn.com https://*.roblox.com https://cdn.discordapp.com https://cdn.weao.gg; connect-src 'self' ipc: http://ipc.localhost https://*.roblox.com https://core.bloxgen.net; object-src 'none'; base-uri 'self'; frame-src 'none'"
    />
    <title>Roblox Account Manager</title>
    <!-- Fonts + Material Icons ligature font, matching the Legacy_Frontend.
         Without the "Material Icons Round" stylesheet the icon ligatures render
         as their raw text (e.g. "manage_accounts"). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- window.api is injected at document-start by Tauri's initialization
         script. Keeping it out of HTML prevents an HTML fallback response from
         ever being parsed as JavaScript (`Unexpected token '<'`). -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
