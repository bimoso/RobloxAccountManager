[package]
name = "robloxaccountmanager"
version = "1.0.0"
description = "RobloxAccountManager - manage multiple Roblox accounts (Tauri build)"
authors = ["RobloxAccountManager"]
edition = "2021"
rust-version = "1.77.2"

# The library holds all application logic (AppState, command/event registration).
# `main.rs` is a thin binary entry point that calls `robloxaccountmanager_lib::run()`.
[lib]
name = "robloxaccountmanager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
# Official Tauri clipboard plugin, replacing legacy JS runtime's main-process `clipboard`
# module for the Account_Browser_Launcher's Copy Cookie action (design "Overview"
# rationale). Its Rust `ClipboardExt::clipboard().write_text()/read_text()` pair
# backs the concrete `browser_launcher::TauriClipboard` (Task 13.7), and the
# matching `clipboard-manager:*` permissions are scoped in capabilities/default.json.
tauri-plugin-clipboard-manager = "2"
# Official Tauri v2 opener plugin, the replacement for legacy JS runtime's main-process
# `shell.openExternal`. Backs `window.rs`'s `open_external` command (Task 16.1),
# opening a URL in the OS default handler via `OpenerExt::opener().open_url()`;
# the matching `opener:allow-open-url` permission is scoped in capabilities/default.json.
tauri-plugin-opener = "2"
# Official Tauri v2 window-state plugin: persists the main window's size,
# position, and maximized state to disk on close and restores it automatically
# the next time the window is created, so the app reopens at whatever size the
# user last left it at instead of always resetting to the built-in default.
tauri-plugin-window-state = "2"
# Native Windows/macOS backdrop effects. Use the current upstream crate so the
# frameless WebView2 window gets the latest Windows 11 Mica/Tabbed material.
window-vibrancy = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "rt-multi-thread", "macros", "io-util", "fs"] }

# Async HTTP client for the Roblox HTTPS calls ported from the legacy JS backend's
# `httpsGet`/`httpsPost`/`net.request` helpers (version, cookie validation, game
# name, share-link/private-server resolution). `rustls-tls` avoids a system
# OpenSSL/native-tls build dependency; `json` is unused (responses are parsed via
# serde_json to mirror the legacy JS backend's raw-body parsing), so only the client + redirect
# control features are enabled.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# The official Wayfern Windows build is a large portable ZIP. Keep extraction
# support focused on the standard Deflate method used by Chromium archives.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Microsoft's official Win32 bindings. Used here for DPAPI
# (`CryptProtectData`/`CryptUnprotectData`) to reproduce legacy safe storage's
# `safe:` format byte-for-byte (Requirement 11.3), and `LocalFree` to release the
# blob DPAPI allocates for its output. Later encryption tasks add `GetTickCount64`
# (already covered by the Win32_System_SystemInformation feature added when needed).
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_SystemInformation",
    # `MessageBoxW`, used by `webview2.rs` (Task 19.4) to surface a native,
    # actionable error dialog when the WebView2 runtime is missing at startup
    # (Requirement 12.7) — the in-app UI cannot render without that runtime.
    "Win32_UI_WindowsAndMessaging",
] }

# Field-encryption primitives, chosen to reproduce the legacy JS build's on-disk
# formats byte-for-byte (Requirement 11.3). All are the RustCrypto "digest 0.10 /
# cipher 0.4" generation, so they share compatible trait versions with no conflict:
#   gs:  -> AES-256-GCM keyed by scrypt(N=2^16, r=8, p=1)          (scrypt + aes-gcm)
#   gcm: -> AES-256-GCM keyed by PBKDF2-HMAC-SHA512, 210k iters     (pbkdf2 + sha2 + aes-gcm)
#   cbc: -> AES-256-CBC keyed by the legacy PBKDF2 key (read-only)  (aes + cbc)
scrypt = "0.11"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
getrandom = "0.2"

# WHATWG URL parser (the Rust implementation of the same URL spec browsers use),
# used by `roblox_process.rs`'s launch-target parser to reproduce the legacy JS backend's
# `new URL(...)` / `searchParams.get(...)` / `pathname` semantics faithfully.
url = "2"

# CDP (Chrome DevTools Protocol) async client, the Rust-ecosystem replacement for
# the legacy JS build's the CDP helper (see design "Login and Account_Browser_
# Launcher CDP flows"). Used by `browser_launcher.rs` to (a) launch a non-headless
# Chromium for the cookie-capture login flow (`Browser::launch` + `with_head()`,
# ported from the legacy JS backend's `puppeteerLogin`) and (b) connect to an already-running
# Donut Browser instance over CDP for cookie injection (Task 13.4). It drives
# Chrome over the same protocol Playwright used, so the identical
# launch/`Network.getAllCookies` / `Network.setCookie` sequences are preserved.
# Default feature is `bytes` only; 0.9 runs on tokio (no runtime feature flag),
# matching this crate's existing tokio runtime.
chromiumoxide = "0.9"

# `StreamExt::next`, needed to drive chromiumoxide's `Handler` stream (the async
# task that pumps CDP messages between this process and the browser). chromiumoxide
# already pulls futures in transitively; this makes the `.next()` extension trait
# available to `browser_launcher.rs` directly.
futures-util = "0.3"

# Managed Roblox deployments are streamed to disk and verified against the
# MD5 digest published in Roblox's rbxPkgManifest before extraction.  The
# cancellation token lets the renderer stop a long multi-package download
# without aborting the Tauri runtime task.
md5 = "0.7"
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
# Per-user Roblox/Bloxstrap/Fishstrap discovery and explicit roblox:// /
# roblox-player: handler switching.  Keeping this target-scoped preserves
# non-Windows `cargo check` support.
winreg = "0.55"

[dev-dependencies]
# Property-based testing framework used by the design's Correctness Properties
# (each `proptest!` function runs >=100 iterations). Test-only, so it never ships
# in the release binary.
proptest = "1"

[features]
# This feature is used for production builds or when a dev server is not
# specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Smaller, faster portable single-exe output (Requirement 12.1).
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
